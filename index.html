<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gatcombe Industrial Limited — Industrial Roofing &amp; Cladding Specialists based in Portsmouth, Hampshire.">
  <title>Gatcombe Industrial Limited | Industrial Roofing &amp; Cladding Portsmouth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── CUSTOM PROPERTIES ────────────────────────────────────────── */
    :root {
      --black:       #1a1a1a;
      --green:       #2d5a27;
      --green-hover: #3a7a32;
      --white:       #ffffff;
      --grey-light:  #f7f7f7;
      --grey-border: #e5e5e5;
      --max-width:   1200px;
    }

    /* ── GLOBAL RESET ─────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Barlow', sans-serif;
      color: var(--black);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ── CONTAINER ────────────────────────────────────────────────── */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── SECTION SPACING ──────────────────────────────────────────── */
    section {
      padding: 80px 20px;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════════════ */

    #header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--white);
      border-bottom: 3px solid var(--green);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      transition: padding 0.25s ease;
    }

    #header.scrolled .header-inner {
      padding: 8px 0;
    }

    #header.scrolled .header-logo img {
      max-height: 42px;
    }

    /* ── Logo (left) ──────────────────────────────────────────────── */
    .header-logo img {
      max-height: 55px;
      width: auto;
      transition: max-height 0.25s ease;
    }

    /* ── Phone (middle) ───────────────────────────────────────────── */
    .header-phone {
      font-weight: 700;
      font-size: 1rem;
      color: var(--green);
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .header-phone:hover {
      color: var(--green-hover);
    }

    /* ── Nav + CTA (right) ────────────────────────────────────────── */
    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav.main-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav.main-nav a {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--black);
      transition: color 0.2s ease;
    }

    nav.main-nav a:hover {
      color: var(--green);
    }

    .btn-cta {
      display: inline-block;
      padding: 10px 22px;
      background: var(--green);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-cta:hover {
      background: var(--green-hover);
    }

    /* ── Hamburger (hidden on desktop) ───────────────────────────── */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 26px;
      height: 2px;
      background: var(--black);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ── Mobile nav drawer ────────────────────────────────────────── */
    .mobile-nav {
      display: none;
      flex-direction: column;
      background: var(--white);
      border-top: 1px solid var(--grey-border);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
    }

    .mobile-nav.open {
      max-height: 420px;
      padding: 12px 0 20px;
    }

    .mobile-nav a {
      display: block;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--black);
      border-bottom: 1px solid var(--grey-border);
      transition: color 0.2s ease, background 0.2s ease;
    }

    .mobile-nav a:hover {
      color: var(--green);
      background: var(--grey-light);
    }

    .mobile-nav .mobile-phone-link {
      color: var(--green);
      font-weight: 700;
    }

    .mobile-nav .mobile-cta {
      margin: 16px 20px 0;
      display: block;
      text-align: center;
      border-bottom: none;
      background: var(--green);
      color: var(--white);
      padding: 12px 22px;
    }

    .mobile-nav .mobile-cta:hover {
      background: var(--green-hover);
      color: var(--white);
    }

    /* ── RESPONSIVE ───────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .header-phone,
      .header-right {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .mobile-nav {
        display: flex;
      }
    }

    @media (max-width: 480px) {
      section {
        padding: 50px 20px;
      }
    }

    /* ── PLACEHOLDER ──────────────────────────────────────────────── */
    .placeholder {
      padding: 80px 20px;
      text-align: center;
      background: var(--grey-light);
      border-bottom: 2px dashed var(--grey-border);
    }

    .placeholder p {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #999;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════════════ -->
  <header id="header">
    <div class="container">
      <div class="header-inner">

        <!-- Left: Logo -->
        <a href="#" aria-label="Gatcombe Industrial Limited — Home">
          <img src="images/logo.png" alt="Gatcombe Industrial Limited" style="max-height:55px">
        </a>

        <!-- Middle: Phone -->
        <a href="tel:07767228086" class="header-phone">07767 228086</a>

        <!-- Right: Nav + CTA -->
        <div class="header-right">
          <nav class="main-nav" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
          </nav>
          <a href="#contact" class="btn-cta">Get a Free Quote</a>
        </div>

        <!-- Mobile: Hamburger -->
        <button
          class="hamburger"
          id="hamburger"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="mobile-nav"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>

    <!-- Mobile nav drawer -->
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
      <a href="tel:07767228086" class="mobile-phone-link">07767 228086</a>
      <a href="#">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
      <a href="#contact" class="mobile-cta">Get a Free Quote</a>
    </nav>
  </header>

  <!-- Placeholder -->
  <div class="placeholder">
    <p>SECTIONS COMING SOON</p>
  </div>

  <!-- hero, intro, services, why-us, gallery, contact, footer to be added -->

  <script>
    /* ── SCROLL: add .scrolled to header ───────────────────────── */
    const header = document.getElementById('header');

    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    /* ── MOBILE MENU TOGGLE ─────────────────────────────────────── */
    const hamburger = document.getElementById('hamburger');
    const mobileNav = document.getElementById('mobile-nav');

    hamburger.addEventListener('click', () => {
      const isOpen = mobileNav.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
    });

    /* Close mobile nav when any link is tapped */
    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileNav.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
